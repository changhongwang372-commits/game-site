<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>若兰 ❤️</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-user-select:none;
    user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:
        "Microsoft YaHei",
        "PingFang SC",
        Arial,
        sans-serif;

    background:#120b20;
    color:white;
}

/* =========================
   游戏主体
========================= */

.game{
    width:100vw;
    height:100vh;
    position:relative;
    overflow:hidden;

    background:
        linear-gradient(
            rgba(20,5,35,.35),
            rgba(20,5,35,.55)
        ),
        url("bg.png")
        center center /
        cover
        no-repeat;
}

/* =========================
   顶部标题
========================= */

.header{
    position:absolute;

    top:18px;
    left:50%;

    transform:translateX(-50%);

    text-align:center;

    z-index:20;

    width:90%;
}

.title{
    font-size:42px;
    font-weight:900;

    color:#fff;

    text-shadow:
        0 0 8px #ff7bd5,
        0 0 20px #ff32b5,
        0 0 45px #ff00aa;
}

.subtitle{
    margin-top:4px;

    font-size:16px;

    color:#ffd9f4;

    text-shadow:
        0 0 8px #ff48c8;
}

/* =========================
   状态栏
========================= */

.status{
    position:absolute;

    top:25px;
    left:25px;

    z-index:20;

    padding:12px 20px;

    border-radius:30px;

    background:rgba(30,5,45,.65);

    border:1px solid #ff6bd5;

    box-shadow:
        0 0 15px #ff24c4,
        inset 0 0 15px rgba(255,100,220,.15);

    font-size:17px;
}

.timer{
    position:absolute;

    top:25px;
    right:25px;

    z-index:20;

    padding:12px 20px;

    border-radius:30px;

    background:rgba(30,5,45,.65);

    border:1px solid #a98cff;

    box-shadow:
        0 0 15px #8c63ff;

    font-size:17px;
}

#score{
    color:#ff8dde;
    font-weight:bold;
}

#time{
    color:#c9b7ff;
    font-weight:bold;
}

/* =========================
   游戏区域
========================= */

.arena{
    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:100%;

    overflow:hidden;
}

/* =========================
   人物
========================= */

.person{
    position:absolute;

    width:90px;
    height:110px;

    object-fit:cover;

    border-radius:50%;

    border:3px solid white;

    z-index:10;

    box-shadow:
        0 0 15px rgba(255,255,255,.7),
        0 0 30px #ff4fca;

    transition:
        transform .1s linear;
}

#boy{
    border-color:#8bb7ff;

    box-shadow:
        0 0 15px #75a7ff,
        0 0 30px #456eff;
}

#girl{
    border-color:#ffb8ed;

    box-shadow:
        0 0 15px #ffb8ed,
        0 0 35px #ff2fbb;
}

/* 人物名字 */

.name{
    position:absolute;

    z-index:15;

    padding:5px 15px;

    border-radius:20px;

    font-size:14px;
    font-weight:bold;

    pointer-events:none;
}

.boy-name{
    color:#d8e7ff;

    border:1px solid #7eafff;

    background:rgba(30,60,140,.65);
}

.girl-name{
    color:#ffe0f6;

    border:1px solid #ff7dd6;

    background:rgba(140,30,110,.65);
}

/* =========================
   爱心粒子
========================= */

.particle{
    position:absolute;

    pointer-events:none;

    z-index:30;

    color:#ff8de1;

    font-size:22px;

    animation:
        particleFly
        1.2s
        ease-out
        forwards;

    text-shadow:
        0 0 10px #ff22bd,
        0 0 20px #ff22bd;
}

@keyframes particleFly{

    0%{
        transform:
            translate(0,0)
            scale(.3)
            rotate(0deg);

        opacity:1;
    }

    100%{
        transform:
            translate(
                var(--x),
                var(--y)
            )
            scale(1.5)
            rotate(180deg);

        opacity:0;
    }
}

/* =========================
   大爱心
========================= */

.big-heart{

    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%)
        scale(0);

    z-index:100;

    font-size:130px;

    filter:
        drop-shadow(0 0 10px #ff1fbd)
        drop-shadow(0 0 35px #ff1fbd)
        drop-shadow(0 0 70px #ff1fbd);

    animation:
        heartAppear
        1s
        ease-out
        forwards;
}

@keyframes heartAppear{

    0%{
        transform:
            translate(-50%,-50%)
            scale(0)
            rotate(-20deg);

        opacity:0;
    }

    60%{
        transform:
            translate(-50%,-50%)
            scale(1.35)
            rotate(10deg);

        opacity:1;
    }

    100%{
        transform:
            translate(-50%,-50%)
            scale(1)
            rotate(0);

        opacity:1;
    }
}

/* =========================
   爱你若兰
========================= */

.love-message{

    position:absolute;

    left:50%;
    top:64%;

    transform:
        translate(-50%,-50%)
        scale(.3);

    z-index:101;

    white-space:nowrap;

    font-size:55px;

    font-weight:900;

    color:white;

    text-shadow:
        0 0 8px white,
        0 0 20px #ff69d4,
        0 0 40px #ff20bd,
        0 0 80px #ff009d;

    animation:
        loveShow
        1.2s
        .25s
        ease-out
        forwards;
}

@keyframes loveShow{

    0%{
        opacity:0;
        transform:
            translate(-50%,-50%)
            scale(.3);
    }

    70%{
        opacity:1;
        transform:
            translate(-50%,-50%)
            scale(1.15);
    }

    100%{
        opacity:1;
        transform:
            translate(-50%,-50%)
            scale(1);
    }
}

/* =========================
   开始按钮
========================= */

.start-btn{

    position:absolute;

    left:50%;
    bottom:35px;

    transform:translateX(-50%);

    z-index:50;

    padding:14px 35px;

    border:none;

    border-radius:35px;

    color:white;

    font-size:19px;
    font-weight:bold;

    background:
        linear-gradient(
            135deg,
            #ff42ba,
            #8c55ff
        );

    box-shadow:
        0 0 15px #ff34ba,
        0 0 35px rgba(255,40,180,.5);

    cursor:pointer;
}

.start-btn:active{
    transform:
        translateX(-50%)
        scale(.95);
}

/* =========================
   手机摇杆
========================= */

.joystick{

    position:absolute;

    left:35px;
    bottom:35px;

    width:145px;
    height:145px;

    z-index:40;

    border-radius:50%;

    border:2px solid
        rgba(210,180,255,.8);

    background:
        rgba(120,80,180,.18);

    box-shadow:
        0 0 25px
        rgba(180,120,255,.4);

    touch-action:none;
}

.joystick-center{

    position:absolute;

    left:50%;
    top:50%;

    width:62px;
    height:62px;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #ffffff,
            #b8a0ff
        );

    box-shadow:
        0 0 20px #b48aff;

    pointer-events:none;
}

/* 方向箭头 */

.arrow{
    position:absolute;

    font-size:22px;

    color:#fff;

    text-shadow:
        0 0 10px #a47aff;

    pointer-events:none;
}

.arrow.up{
    top:7px;
    left:58px;
}

.arrow.down{
    bottom:7px;
    left:58px;
}

.arrow.left{
    left:7px;
    top:57px;
}

.arrow.right{
    right:7px;
    top:57px;
}

/* =========================
   电脑提示
========================= */

.control-tip{

    position:absolute;

    right:25px;
    bottom:30px;

    z-index:30;

    padding:10px 16px;

    border-radius:15px;

    background:
        rgba(20,5,40,.55);

    border:
        1px solid
        rgba(200,170,255,.5);

    font-size:14px;

    color:#e8dcff;
}

/* =========================
   手机适配
========================= */

@media(max-width:600px){

    .title{
        font-size:30px;
    }

    .subtitle{
        font-size:13px;
    }

    .status,
    .timer{

        top:75px;

        padding:8px 12px;

        font-size:13px;
    }

    .status{
        left:10px;
    }

    .timer{
        right:10px;
    }

    .person{

        width:72px;
        height:88px;
    }

    .joystick{

        width:130px;
        height:130px;

        left:20px;
        bottom:25px;
    }

    .joystick-center{

        width:56px;
        height:56px;
    }

    .control-tip{
        display:none;
    }

    .start-btn{
        bottom:25px;

        padding:12px 25px;

        font-size:16px;
    }

    .love-message{
        font-size:34px;
    }

    .big-heart{
        font-size:90px;
    }
}

</style>
</head>

<body>

<div class="game">

    <!-- 顶部 -->
    <div class="header">

        <div class="title">
            ❤️ 若兰 ❤️
        </div>

        <div class="subtitle">
            爱，就要勇敢追上她
        </div>

    </div>


    <!-- 状态 -->
    <div class="status">
        ❤️ 追逐次数：
        <span id="score">0</span>
    </div>

    <div class="timer">
        ⏱️ 剩余时间：
        <span id="time">30</span>
    </div>


    <!-- 游戏区域 -->
    <div
        class="arena"
        id="arena"
    >

        <!-- 女生 -->
        <img
            id="girl"
            class="person"
            src="girl.jpg"
            alt="若兰"
        >

        <div
            id="girlName"
            class="name girl-name"
        >
            若兰
        </div>


        <!-- 男生 -->
        <img
            id="boy"
            class="person"
            src="boy.jpg"
            alt="我"
        >

        <div
            id="boyName"
            class="name boy-name"
        >
            我
        </div>

    </div>


    <!-- 手机摇杆 -->

    <div
        class="joystick"
        id="joystick"
    >

        <div class="arrow up">▲</div>

        <div class="arrow down">▼</div>

        <div class="arrow left">◀</div>

        <div class="arrow right">▶</div>

        <div
            class="joystick-center"
            id="stick"
        ></div>

    </div>


    <!-- 电脑操作提示 -->

    <div class="control-tip">
        🖥️ WASD / 方向键移动
    </div>


    <!-- 开始 -->

    <button
        class="start-btn"
        id="startBtn"
    >
        ❤️ 开始追若兰
    </button>

</div>


<script>

/* =========================
   获取元素
========================= */

const arena =
    document.getElementById("arena");

const boy =
    document.getElementById("boy");

const girl =
    document.getElementById("girl");

const boyName =
    document.getElementById("boyName");

const girlName =
    document.getElementById("girlName");

const scoreText =
    document.getElementById("score");

const timeText =
    document.getElementById("time");

const startBtn =
    document.getElementById("startBtn");

const joystick =
    document.getElementById("joystick");

const stick =
    document.getElementById("stick");


/* =========================
   游戏变量
========================= */

let gameRunning = false;

let score = 0;

let time = 30;

let countdown = null;

let gameLoop = null;

let girlTimer = null;


/* 男生速度 */

const playerSpeed = 5;


/* 键盘 */

const keys = {};


/* 摇杆 */

let joyX = 0;

let joyY = 0;


/* =========================
   键盘控制
========================= */

document.addEventListener(
    "keydown",
    function(e){

        keys[e.key.toLowerCase()] = true;

        if([
            "arrowup",
            "arrowdown",
            "arrowleft",
            "arrowright",
            " "
        ].includes(e.key.toLowerCase())){

            e.preventDefault();
        }

    }
);


document.addEventListener(
    "keyup",
    function(e){

        keys[e.key.toLowerCase()] = false;

    }
);


/* =========================
   设置位置
========================= */

function setPosition(
    element,
    x,
    y
){

    element.style.left =
        x + "px";

    element.style.top =
        y + "px";
}


/* =========================
   女生随机跑
========================= */

function moveGirl(){

    if(!gameRunning) return;

    const maxX =
        arena.clientWidth -
        girl.offsetWidth;

    const maxY =
        arena.clientHeight -
        girl.offsetHeight;

    const x =
        Math.random() *
        Math.max(0,maxX);

    const y =
        Math.random() *
        Math.max(0,maxY);

    setPosition(
        girl,
        x,
        y
    );
}


/* =========================
   玩家移动
========================= */

function moveBoy(){

    if(!gameRunning) return;


    let dx = 0;

    let dy = 0;


    /* 键盘 */

    if(keys["w"] ||
       keys["arrowup"]){

        dy -= 1;
    }

    if(keys["s"] ||
       keys["arrowdown"]){

        dy += 1;
    }

    if(keys["a"] ||
       keys["arrowleft"]){

        dx -= 1;
    }

    if(keys["d"] ||
       keys["arrowright"]){

        dx += 1;
    }


    /* 手机摇杆 */

    dx += joyX;

    dy += joyY;


    /* 防止斜向速度过快 */

    const length =
        Math.sqrt(
            dx * dx +
            dy * dy
        );

    if(length > 0){

        dx /= length;
        dy /= length;
    }


    let x =
        boy.offsetLeft +
        dx * playerSpeed;

    let y =
        boy.offsetTop +
        dy * playerSpeed;


    const maxX =
        arena.clientWidth -
        boy.offsetWidth;

    const maxY =
        arena.clientHeight -
        boy.offsetHeight;


    x = Math.max(
        0,
        Math.min(maxX,x)
    );

    y = Math.max(
        0,
        Math.min(maxY,y)
    );


    setPosition(
        boy,
        x,
        y
    );


    /* 名字跟随 */

    updateNames();


    /* 检查碰撞 */

    checkCatch();
}


/* =========================
   名字跟随人物
========================= */

function updateNames(){

    boyName.style.left =
        (
            boy.offsetLeft +
            boy.offsetWidth / 2 -
            boyName.offsetWidth / 2
        ) + "px";

    boyName.style.top =
        (
            boy.offsetTop -
            35
        ) + "px";


    girlName.style.left =
        (
            girl.offsetLeft +
            girl.offsetWidth / 2 -
            girlName.offsetWidth / 2
        ) + "px";

    girlName.style.top =
        (
            girl.offsetTop -
            35
        ) + "px";
}


/* =========================
   碰撞检测
========================= */

function checkCatch(){

    const bx =
        boy.offsetLeft +
        boy.offsetWidth / 2;

    const by =
        boy.offsetTop +
        boy.offsetHeight / 2;


    const gx =
        girl.offsetLeft +
        girl.offsetWidth / 2;

    const gy =
        girl.offsetTop +
        girl.offsetHeight / 2;


    const dx =
        gx - bx;

    const dy =
        gy - by;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    if(distance < 75){

        catchGirl();

    }
}


/* =========================
   追到若兰
========================= */

function catchGirl(){

    if(!gameRunning) return;


    score++;

    scoreText.textContent =
        score;


    createHeartExplosion();


    /* 若兰逃跑 */

    moveGirl();

}


/* =========================
   爱心爆炸
========================= */

function createHeartExplosion(){

    const x =
        girl.offsetLeft +
        girl.offsetWidth / 2;

    const y =
        girl.offsetTop +
        girl.offsetHeight / 2;


    for(let i=0;i<18;i++){

        const heart =
            document.createElement("div");

        heart.className =
            "particle";

        heart.textContent =
            Math.random() > .3
            ? "❤️"
            : "💗";


        heart.style.left =
            x + "px";

        heart.style.top =
            y + "px";


        const angle =
            Math.random() *
            Math.PI * 2;

        const distance =
            60 +
            Math.random() * 120;


        heart.style.setProperty(
            "--x",
            Math.cos(angle) *
            distance +
            "px"
        );

        heart.style.setProperty(
            "--y",
            Math.sin(angle) *
            distance +
            "px"
        );


        arena.appendChild(
            heart
        );


        setTimeout(
            () => heart.remove(),
            1300
        );
    }
}


/* =========================
   游戏开始
========================= */

function startGame(){

    /* 清除旧画面 */

    arena
        .querySelectorAll(
            ".big-heart,.love-message,.particle"
        )
        .forEach(
            e => e.remove()
        );


    clearInterval(countdown);

    clearInterval(girlTimer);


    score = 0;

    time = 30;

    gameRunning = true;


    scoreText.textContent =
        "0";

    timeText.textContent =
        "30";


    startBtn.style.display =
        "none";


    boy.style.display =
        "block";

    girl.style.display =
        "block";

    boyName.style.display =
        "block";

    girlName.style.display =
        "block";


    /* 初始位置 */

    setPosition(
        boy,
        50,
        arena.clientHeight / 2
    );


    setPosition(
        girl,
        arena.clientWidth - 150,
        arena.clientHeight / 2
    );


    updateNames();


    /* 若兰每1.3秒跑一次 */

    girlTimer =
        setInterval(
            moveGirl,
            1300
        );


    /* 30秒倒计时 */

    countdown =
        setInterval(
            function(){

                if(!gameRunning)
                    return;


                time--;

                timeText.textContent =
                    time;


                if(time <= 0){

                    endGame();

                }

            },
            1000
        );


    /* 游戏循环 */

    gameLoop =
        setInterval(
            moveBoy,
            30
        );
}


/* =========================
   游戏结束
========================= */

function endGame(){

    gameRunning = false;


    clearInterval(countdown);

    clearInterval(girlTimer);

    clearInterval(gameLoop);


    boy.style.display =
        "none";

    girl.style.display =
        "none";

    boyName.style.display =
        "none";

    girlName.style.display =
        "none";


    /* 大爱心 */

    const heart =
        document.createElement("div");

    heart.className =
        "big-heart";

    heart.textContent =
        "❤️";

    arena.appendChild(
        heart
    );


    /* 爱你若兰 */

    const message =
        document.createElement("div");

    message.className =
        "love-message";

    message.textContent =
        "爱你，若兰 ❤️";

    arena.appendChild(
        message
    );


    /* 再玩一次 */

    startBtn.textContent =
        "❤️ 再追一次";

    startBtn.style.display =
        "block";


    /* 最终爆发 */

    setTimeout(
        function(){

            for(let i=0;i<40;i++){

                createHeartExplosion();
            }

        },
        500
    );
}


/* =========================
   手机摇杆
========================= */

let joystickActive = false;


function updateJoystick(
    clientX,
    clientY
){

    const rect =
        joystick.getBoundingClientRect();


    const centerX =
        rect.left +
        rect.width / 2;

    const centerY =
        rect.top +
        rect.height / 2;


    let dx =
        clientX -
        centerX;

    let dy =
        clientY -
        centerY;


    const max =
        rect.width / 2 -
        30;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    if(distance > max){

        dx =
            dx / distance * max;

        dy =
            dy / distance * max;
    }


    joyX =
        dx / max;

    joyY =
        dy / max;


    stick.style.transform =
        `translate(
            ${dx}px,
            ${dy}px
        ) translate(-50%,-50%)`;
}


function resetJoystick(){

    joyX = 0;

    joyY = 0;

    stick.style.transform =
        "translate(-50%,-50%)";
}


/* 手机触摸 */

joystick.addEventListener(
    "touchstart",
    function(e){

        joystickActive = true;

        const t =
            e.touches[0];

        updateJoystick(
            t.clientX,
            t.clientY
        );

        e.preventDefault();

    },
    {passive:false}
);


joystick.addEventListener(
    "touchmove",
    function(e){

        if(!joystickActive)
            return;

        const t =
            e.touches[0];

        updateJoystick(
            t.clientX,
            t.clientY
        );

        e.preventDefault();

    },
    {passive:false}
);


joystick.addEventListener(
    "touchend",
    function(){

        joystickActive = false;

        resetJoystick();

    }
);


/* =========================
   开始
========================= */

startBtn.addEventListener(
    "click",
    startGame
);


/* 默认隐藏人物 */

boy.style.display =
    "none";

girl.style.display =
    "none";

boyName.style.display =
    "none";

girlName.style.display =
    "none";

</script>

</body>
</html>
