<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>💕 若兰</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    min-height:100vh;
    overflow:hidden;
    font-family:
        "Microsoft YaHei",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background:
        radial-gradient(circle at 20% 20%,#ff9a9e 0%,transparent 35%),
        radial-gradient(circle at 80% 80%,#fad0c4 0%,transparent 35%),
        linear-gradient(135deg,#ff758c,#ff7eb3);

    display:flex;
    justify-content:center;
    align-items:center;
}

.game{
    width:min(95vw,900px);
    height:min(92vh,700px);

    background:rgba(255,255,255,.18);

    border:1px solid rgba(255,255,255,.35);

    border-radius:30px;

    backdrop-filter:blur(18px);

    box-shadow:
        0 25px 80px rgba(100,0,40,.35);

    padding:20px;

    text-align:center;
}

h1{
    margin:0;

    color:white;

    font-size:42px;

    text-shadow:
        0 4px 15px rgba(100,0,40,.25);
}

.subtitle{
    color:rgba(255,255,255,.9);

    margin:5px 0 15px;

    font-size:15px;
}

#gameArea{
    position:relative;

    width:100%;

    height:calc(100% - 150px);

    min-height:400px;

    border-radius:24px;

    overflow:hidden;

    background:
        linear-gradient(
            rgba(255,255,255,.12),
            rgba(255,255,255,.04)
        );

    border:2px solid rgba(255,255,255,.3);
}

/* 草地 */

.ground{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:28%;

    background:
        linear-gradient(
            rgba(255,255,255,.12),
            rgba(255,255,255,.02)
        );

    border-top:2px solid rgba(255,255,255,.15);
}

/* 人物 */

.character{
    position:absolute;

    width:70px;
    height:95px;

    z-index:5;

    transition:
        left .08s linear,
        top .08s linear;

    user-select:none;

    pointer-events:none;
}

/* 头 */

.head{
    position:absolute;

    width:42px;
    height:42px;

    border-radius:50%;

    left:14px;
    top:0;

    background:#ffd1b3;

    border:2px solid rgba(0,0,0,.12);
}

/* 眼睛 */

.eye{
    position:absolute;

    width:5px;
    height:7px;

    border-radius:50%;

    background:#333;

    top:15px;
}

.eye.left{
    left:9px;
}

.eye.right{
    right:9px;
}

/* 嘴 */

.mouth{
    position:absolute;

    width:14px;
    height:7px;

    border-bottom:2px solid #d85b6a;

    border-radius:50%;

    left:12px;
    bottom:7px;
}

/* 身体 */

.body{
    position:absolute;

    width:48px;
    height:43px;

    left:11px;
    top:39px;

    border-radius:18px 18px 12px 12px;
}

/* 手 */

.arm{
    position:absolute;

    width:12px;
    height:35px;

    border-radius:10px;

    top:43px;
}

.arm.left{
    left:2px;

    transform:rotate(15deg);
}

.arm.right{
    right:2px;

    transform:rotate(-15deg);
}

/* 腿 */

.leg{
    position:absolute;

    width:13px;
    height:25px;

    border-radius:10px;

    top:75px;
}

.leg.left{
    left:18px;

    transform:rotate(5deg);
}

.leg.right{
    right:18px;

    transform:rotate(-5deg);
}

/* 帅哥 */

.boy .body,
.boy .arm,
.boy .leg{
    background:#3b82f6;
}

.boy .head{
    box-shadow:
        inset 0 8px 0 #333;
}

/* 美女 */

.girl .body,
.girl .arm,
.girl .leg{
    background:#f472b6;
}

.girl .head{
    box-shadow:
        inset 0 8px 0 #54263a;
}

/* 美女裙子 */

.girl .body{
    width:55px;
    height:45px;

    left:8px;

    border-radius:15px 15px 25px 25px;
}

/* 名字 */

.name{
    position:absolute;

    top:-28px;

    width:100px;

    left:-15px;

    color:white;

    font-size:14px;

    font-weight:bold;

    text-shadow:
        0 2px 5px rgba(0,0,0,.4);
}

/* 爱心 */

.heart{
    position:absolute;

    font-size:28px;

    pointer-events:none;

    z-index:20;

    animation:
        heartFly 2.2s ease-out forwards;
}

@keyframes heartFly{

    0%{
        opacity:1;

        transform:
            translate(0,0)
            scale(.5)
            rotate(0deg);
    }

    50%{
        opacity:1;

        transform:
            translate(
                calc((var(--x))*1px),
                -100px
            )
            scale(1.3)
            rotate(15deg);
    }

    100%{
        opacity:0;

        transform:
            translate(
                calc((var(--x))*1px),
                -240px
            )
            scale(.8)
            rotate(-20deg);
    }
}

/* 爱你若兰 */

.loveMessage{
    position:absolute;

    left:50%;
    top:45%;

    transform:
        translate(-50%,-50%)
        scale(0);

    z-index:30;

    color:white;

    font-size:clamp(35px,8vw,72px);

    font-weight:900;

    white-space:nowrap;

    text-shadow:
        0 5px 20px rgba(160,0,50,.6),
        0 0 25px rgba(255,255,255,.7);

    opacity:0;
}

.loveMessage.show{
    animation:
        loveShow 3s ease forwards;
}

@keyframes loveShow{

    0%{
        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(.2);
    }

    25%{
        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(1.2);
    }

    45%{
        transform:
            translate(-50%,-50%)
            scale(1);
    }

    85%{
        opacity:1;
    }

    100%{
        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(1.1);
    }
}

/* 开始按钮 */

#startBtn{
    margin-top:15px;

    padding:13px 35px;

    border:0;

    border-radius:30px;

    background:white;

    color:#ec4899;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 8px 20px rgba(0,0,0,.2);
}

#startBtn:active{
    transform:scale(.96);
}

/* 手机方向键 */

.controls{
    position:absolute;

    left:50%;

    bottom:15px;

    transform:translateX(-50%);

    width:170px;

    height:125px;

    z-index:50;

    display:none;
}

.control{
    position:absolute;

    width:52px;
    height:52px;

    border:0;

    border-radius:15px;

    background:rgba(255,255,255,.8);

    color:#ec4899;

    font-size:25px;

    font-weight:bold;

    box-shadow:
        0 5px 15px rgba(0,0,0,.2);

    touch-action:none;
}

.up{
    left:59px;
    top:0;
}

.down{
    left:59px;
    bottom:0;
}

.left{
    left:0;
    top:59px;
}

.right{
    right:0;
    top:59px;
}

.tip{
    position:absolute;

    left:50%;

    bottom:15px;

    transform:translateX(-50%);

    color:rgba(255,255,255,.7);

    font-size:13px;

    z-index:2;
}

@media(max-width:700px){

    .game{
        width:96vw;
        height:94vh;

        padding:12px;

        border-radius:22px;
    }

    h1{
        font-size:32px;
    }

    .subtitle{
        margin-bottom:8px;
    }

    #gameArea{
        height:calc(100% - 105px);

        min-height:420px;
    }

    .controls{
        display:block;
    }

    .tip{
        display:none;
    }

    #startBtn{
        margin-top:8px;
    }
}

</style>
</head>


<body>

<div class="game">

    <h1>💕 若兰</h1>

    <div class="subtitle">
        爱，就要勇敢追上她 ❤️
    </div>


    <div id="gameArea">

        <div class="ground"></div>


        <!-- 帅哥 -->

        <div
            id="boy"
            class="character boy"
            style="left:40px;top:80px;"
        >

            <div class="name">
                帅哥
            </div>

            <div class="head">

                <div class="eye left"></div>

                <div class="eye right"></div>

                <div class="mouth"></div>

            </div>

            <div class="body"></div>

            <div class="arm left"></div>

            <div class="arm right"></div>

            <div class="leg left"></div>

            <div class="leg right"></div>

        </div>


        <!-- 美女 -->

        <div
            id="girl"
            class="character girl"
            style="left:400px;top:200px;"
        >

            <div class="name">
                若兰 ❤️
            </div>

            <div class="head">

                <div class="eye left"></div>

                <div class="eye right"></div>

                <div class="mouth"></div>

            </div>

            <div class="body"></div>

            <div class="arm left"></div>

            <div class="arm right"></div>

            <div class="leg left"></div>

            <div class="leg right"></div>

        </div>


        <!-- 爱心文字 -->

        <div
            id="loveMessage"
            class="loveMessage"
        >
            ❤️ 爱你若兰 ❤️
        </div>


        <!-- 手机控制 -->

        <div class="controls">

            <button
                class="control up"
                data-key="up"
            >
                ▲
            </button>

            <button
                class="control down"
                data-key="down"
            >
                ▼
            </button>

            <button
                class="control left"
                data-key="left"
            >
                ◀
            </button>

            <button
                class="control right"
                data-key="right"
            >
                ▶
            </button>

        </div>


        <div class="tip">
            电脑：使用 WASD 或方向键追逐若兰
        </div>

    </div>


    <button id="startBtn">
        💕 开始追爱
    </button>

</div>


<script>

const gameArea =
    document.getElementById("gameArea");

const boy =
    document.getElementById("boy");

const girl =
    document.getElementById("girl");

const loveMessage =
    document.getElementById("loveMessage");

const startBtn =
    document.getElementById("startBtn");


let playing = false;

let loveFinished = false;

let keys = {};

let boyX = 40;

let boyY = 80;

let girlX = 400;

let girlY = 200;

const speed = 4;


/*
    键盘控制
*/

document.addEventListener(
    "keydown",
    function(e){

        if([
            "ArrowUp",
            "ArrowDown",
            "ArrowLeft",
            "ArrowRight",
            "w",
            "a",
            "s",
            "d",
            "W",
            "A",
            "S",
            "D"
        ].includes(e.key)){

            e.preventDefault();

            keys[e.key.toLowerCase()] = true;
        }

    }
);


document.addEventListener(
    "keyup",
    function(e){

        keys[e.key.toLowerCase()] = false;

    }
);


/*
    手机按钮
*/

document
.querySelectorAll(".control")
.forEach(button => {

    const key =
        button.dataset.key;


    function down(e){

        e.preventDefault();

        keys[key] = true;
    }


    function up(e){

        e.preventDefault();

        keys[key] = false;
    }


    button.addEventListener(
        "pointerdown",
        down
    );

    button.addEventListener(
        "pointerup",
        up
    );

    button.addEventListener(
        "pointercancel",
        up
    );

    button.addEventListener(
        "pointerleave",
        up
    );

});


/*
    美女随机移动
*/

function moveGirl(){

    if(!playing || loveFinished){

        return;
    }


    const width =
        gameArea.clientWidth;

    const height =
        gameArea.clientHeight;


    const margin = 80;


    girlX =
        Math.random() *
        (width - 100) +
        20;


    girlY =
        Math.random() *
        (height - 170) +
        30;


    girlX =
        Math.max(
            10,
            Math.min(
                girlX,
                width - 80
            )
        );


    girlY =
        Math.max(
            10,
            Math.min(
                girlY,
                height - 130
            )
        );


    girl.style.left =
        girlX + "px";


    girl.style.top =
        girlY + "px";

}


/*
    显示爱心
*/

function createHearts(){

    const rect =
        girl.getBoundingClientRect();

    const areaRect =
        gameArea.getBoundingClientRect();


    const centerX =
        rect.left -
        areaRect.left +
        35;


    const centerY =
        rect.top -
        areaRect.top +
        30;


    for(
        let i = 0;
        i < 30;
        i++
    ){

        const heart =
            document.createElement("div");


        heart.className =
            "heart";


        const hearts = [
            "❤️",
            "💕",
            "💗",
            "💖",
            "💘",
            "💓"
        ];


        heart.textContent =
            hearts[
                Math.floor(
                    Math.random() *
                    hearts.length
                )
            ];


        heart.style.left =
            centerX + "px";


        heart.style.top =
            centerY + "px";


        heart.style.setProperty(
            "--x",
            (Math.random()*300-150)
        );


        heart.style.animationDelay =
            (Math.random()*0.8) + "s";


        gameArea.appendChild(
            heart
        );


        setTimeout(
            () => heart.remove(),
            3000
        );

    }

}


/*
    追到若兰
*/

function catchGirl(){

    loveFinished = true;

    playing = false;


    createHearts();


    loveMessage.classList.remove(
        "show"
    );


    /*
        强制重新触发动画
    */

    void loveMessage.offsetWidth;


    loveMessage.classList.add(
        "show"
    );


    startBtn.textContent =
        "❤️ 再追一次";


    setTimeout(
        () => {

            loveMessage.classList.remove(
                "show"
            );

        },
        3200
    );

}


/*
    判断距离
*/

function checkCatch(){

    const dx =
        boyX - girlX;

    const dy =
        boyY - girlY;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    if(distance < 65){

        catchGirl();

    }

}


/*
    游戏循环
*/

function gameLoop(){

    if(playing){

        let dx = 0;

        let dy = 0;


        if(
            keys["arrowup"] ||
            keys["w"] ||
            keys["up"]
        ){

            dy -= speed;

        }


        if(
            keys["arrowdown"] ||
            keys["s"] ||
            keys["down"]
        ){

            dy += speed;

        }


        if(
            keys["arrowleft"] ||
            keys["a"] ||
            keys["left"]
        ){

            dx -= speed;

        }


        if(
            keys["arrowright"] ||
            keys["d"] ||
            keys["right"]
        ){

            dx += speed;

        }


        boyX += dx;

        boyY += dy;


        /*
            限制帅哥不能跑出地图
        */

        const maxX =
            gameArea.clientWidth - 70;


        const maxY =
            gameArea.clientHeight - 110;


        boyX =
            Math.max(
                0,
                Math.min(
                    boyX,
                    maxX
                )
            );


        boyY =
            Math.max(
                0,
                Math.min(
                    boyY,
                    maxY
                )
            );


        boy.style.left =
            boyX + "px";


        boy.style.top =
            boyY + "px";


        checkCatch();

    }


    requestAnimationFrame(
        gameLoop
    );

}


/*
    开始游戏
*/

startBtn.addEventListener(
    "click",
    function(){

        playing = true;

        loveFinished = false;


        boyX = 30;

        boyY = 60;


        boy.style.left =
            boyX + "px";


        boy.style.top =
            boyY + "px";


        moveGirl();


        loveMessage.classList.remove(
            "show"
        );


        startBtn.textContent =
            "💗 追逐若兰中…";

    }
);


/*
    游戏循环启动
*/

gameLoop();


/*
    定时让若兰换位置
*/

setInterval(
    function(){

        if(playing){

            moveGirl();

        }

    },
    1800
);

</script>

</body>
</html>
