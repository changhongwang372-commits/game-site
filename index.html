<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>若兰 ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family:
        "Microsoft YaHei",
        "PingFang SC",
        Arial,
        sans-serif;

    background:
        radial-gradient(circle at 20% 20%, #ffd6ec 0%, transparent 30%),
        radial-gradient(circle at 80% 80%, #d9d5ff 0%, transparent 30%),
        linear-gradient(135deg, #120d20, #302044, #170e2a);

    color: white;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;
}

.game {
    width: min(95vw, 900px);
    text-align: center;
}

.title {
    font-size: 42px;
    font-weight: bold;
    margin-bottom: 8px;

    text-shadow:
        0 0 10px #ff8acb,
        0 0 25px #ff4fa3;
}

.subtitle {
    font-size: 16px;
    opacity: 0.8;
    margin-bottom: 20px;
}

.info {
    display: flex;
    justify-content: center;
    gap: 30px;

    font-size: 18px;
    margin-bottom: 15px;
}

#score {
    color: #ff9bd3;
    font-weight: bold;
}

#time {
    color: #c8b7ff;
    font-weight: bold;
}

.arena {
    width: 100%;
    height: min(65vh, 560px);

    position: relative;

    border-radius: 28px;

    overflow: hidden;

    border: 2px solid rgba(255,255,255,0.25);

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,0.10),
            rgba(255,255,255,0.03)
        );

    box-shadow:
        0 20px 60px rgba(0,0,0,0.5),
        inset 0 0 50px rgba(255,150,220,0.08);
}

/* 人物 */

.person {
    position: absolute;

    width: 100px;
    height: 120px;

    object-fit: cover;

    border-radius: 50%;

    border: 4px solid white;

    box-shadow:
        0 8px 25px rgba(0,0,0,0.5),
        0 0 20px rgba(255,150,220,0.5);

    user-select: none;

    transition:
        left 0.08s linear,
        top 0.08s linear;
}

#boy {
    width: 95px;
    height: 115px;

    z-index: 5;
}

#girl {
    width: 95px;
    height: 115px;

    z-index: 4;
}

/* 开始按钮 */

button {
    margin-top: 22px;

    padding: 14px 40px;

    border: none;

    border-radius: 30px;

    font-size: 20px;
    font-weight: bold;

    color: white;

    background:
        linear-gradient(135deg, #ff5ca8, #9b6cff);

    cursor: pointer;

    box-shadow:
        0 8px 25px rgba(255,80,170,0.35);

    transition: 0.2s;
}

button:hover {
    transform: translateY(-2px) scale(1.03);
}

button:active {
    transform: scale(0.96);
}

/* 开始前隐藏 */

.hidden {
    display: none;
}

/* 爱心 */

.heart {
    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    font-size: 90px;

    z-index: 20;

    animation:
        heartPop 0.8s ease forwards,
        heartBeat 1s ease-in-out infinite;

    text-shadow:
        0 0 15px #ff5ca8,
        0 0 40px #ff2f8b;
}

/* 爱你若兰 */

.love-text {
    position: absolute;

    left: 50%;
    top: 65%;

    transform: translateX(-50%);

    z-index: 21;

    font-size: 42px;

    font-weight: bold;

    white-space: nowrap;

    color: #fff;

    text-shadow:
        0 0 10px #ff5ca8,
        0 0 25px #ff4fa3,
        0 0 50px #ff2088;

    animation: loveText 1s ease forwards;
}

/* 背景爱心 */

.bg-heart {
    position: absolute;

    color: rgba(255,150,210,0.15);

    font-size: 25px;

    animation: floatHeart 5s linear infinite;
}

@keyframes heartPop {

    0% {
        transform: translate(-50%, -50%) scale(0);
        opacity: 0;
    }

    70% {
        transform: translate(-50%, -50%) scale(1.3);
        opacity: 1;
    }

    100% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
    }
}

@keyframes heartBeat {

    0%,100% {
        scale: 1;
    }

    50% {
        scale: 1.12;
    }
}

@keyframes loveText {

    0% {
        opacity: 0;
        transform: translateX(-50%) scale(0.5);
    }

    100% {
        opacity: 1;
        transform: translateX(-50%) scale(1);
    }
}

@keyframes floatHeart {

    0% {
        transform: translateY(100%);
        opacity: 0;
    }

    20% {
        opacity: 1;
    }

    100% {
        transform: translateY(-600px);
        opacity: 0;
    }
}

/* 手机 */

@media (max-width: 600px) {

    .title {
        font-size: 32px;
    }

    .arena {
        height: 65vh;
    }

    .person {
        width: 75px !important;
        height: 90px !important;
    }

    .love-text {
        font-size: 30px;
    }

    .heart {
        font-size: 70px;
    }
}
</style>
</head>

<body>

<div class="game">

    <div class="title">
        ❤️ 若兰 ❤️
    </div>

    <div class="subtitle">
        一场只为追到你的浪漫小游戏
    </div>

    <div class="info">
        <div>
            追逐次数：
            <span id="score">0</span>
        </div>

        <div>
            时间：
            <span id="time">30</span> 秒
        </div>
    </div>

    <div class="arena" id="arena">

        <!-- 女生 -->
        <img
            id="girl"
            class="person"
            src="girl.jpg"
            alt="若兰"
        >

        <!-- 男生 -->
        <img
            id="boy"
            class="person"
            src="boy.jpg"
            alt="男生"
        >

    </div>

    <button id="startBtn">
        ❤️ 开始追若兰
    </button>

</div>

<script>

const arena = document.getElementById("arena");

const boy = document.getElementById("boy");

const girl = document.getElementById("girl");

const startBtn = document.getElementById("startBtn");

const scoreText = document.getElementById("score");

const timeText = document.getElementById("time");

let score = 0;

let time = 30;

let gameRunning = false;

let timer = null;

let moveTimer = null;


/* 设置人物位置 */

function setPosition(element, x, y) {

    element.style.left = x + "px";

    element.style.top = y + "px";
}


/* 随机女生位置 */

function randomGirlPosition() {

    const arenaWidth = arena.clientWidth;

    const arenaHeight = arena.clientHeight;

    const girlWidth = girl.offsetWidth;

    const girlHeight = girl.offsetHeight;

    const x = Math.random() *
        (arenaWidth - girlWidth);

    const y = Math.random() *
        (arenaHeight - girlHeight);

    setPosition(girl, x, y);
}


/* 男生追逐女生 */

function chaseGirl() {

    if (!gameRunning) return;

    const boyWidth = boy.offsetWidth;

    const boyHeight = boy.offsetHeight;

    const girlLeft = girl.offsetLeft;

    const girlTop = girl.offsetTop;

    const boyLeft = boy.offsetLeft;

    const boyTop = boy.offsetTop;

    const dx = girlLeft - boyLeft;

    const dy = girlTop - boyTop;

    const distance =
        Math.sqrt(dx * dx + dy * dy);

    /* 追到 */

    if (distance < 70) {

        catchGirl();

        return;
    }

    const speed = 4;

    const angle =
        Math.atan2(dy, dx);

    let newX =
        boyLeft + Math.cos(angle) * speed;

    let newY =
        boyTop + Math.sin(angle) * speed;

    newX = Math.max(
        0,
        Math.min(
            arena.clientWidth - boyWidth,
            newX
        )
    );

    newY = Math.max(
        0,
        Math.min(
            arena.clientHeight - boyHeight,
            newY
        )
    );

    setPosition(
        boy,
        newX,
        newY
    );
}


/* 追到女生 */

function catchGirl() {

    score++;

    scoreText.textContent = score;

    /* 女生重新逃跑 */

    randomGirlPosition();

    /* 男生重新开始追 */

    const boyX =
        Math.random() *
        (arena.clientWidth - boy.offsetWidth);

    const boyY =
        Math.random() *
        (arena.clientHeight - boy.offsetHeight);

    setPosition(
        boy,
        boyX,
        boyY
    );
}


/* 游戏结束 */

function endGame() {

    gameRunning = false;

    clearInterval(timer);

    clearInterval(moveTimer);

    startBtn.disabled = false;

    startBtn.textContent =
        "❤️ 再追一次";

    /* 隐藏人物 */

    boy.classList.add("hidden");

    girl.classList.add("hidden");

    /* 爱心 */

    const heart =
        document.createElement("div");

    heart.className = "heart";

    heart.textContent = "❤️";

    arena.appendChild(heart);


    /* 文字 */

    const love =
        document.createElement("div");

    love.className = "love-text";

    love.textContent = "爱你 若兰";

    arena.appendChild(love);


    timeText.textContent =
        "追到了 ❤️";


    /* 背景飘爱心 */

    for (let i = 0; i < 18; i++) {

        const h =
            document.createElement("div");

        h.className =
            "bg-heart";

        h.textContent = "♥";

        h.style.left =
            Math.random() * 100 + "%";

        h.style.bottom =
            "-30px";

        h.style.animationDelay =
            Math.random() * 3 + "s";

        arena.appendChild(h);
    }
}


/* 开始游戏 */

function startGame() {

    /* 清除旧元素 */

    arena
        .querySelectorAll(
            ".heart,.love-text,.bg-heart"
        )
        .forEach(
            e => e.remove()
        );


    score = 0;

    time = 30;

    gameRunning = true;


    scoreText.textContent = "0";

    timeText.textContent = "30";

    startBtn.disabled = true;

    startBtn.textContent =
        "追逐中……";


    boy.classList.remove("hidden");

    girl.classList.remove("hidden");


    /* 初始位置 */

    setPosition(
        boy,
        20,
        arena.clientHeight / 2
    );

    setPosition(
        girl,
        arena.clientWidth - 130,
        arena.clientHeight / 2
    );


    /* 女生不断移动 */

    moveTimer =
        setInterval(
            randomGirlPosition,
            1200
        );


    /* 男生不断追 */

    timer =
        setInterval(
            () => {

                time--;

                timeText.textContent =
                    time;

                chaseGirl();

                if (time <= 0) {

                    endGame();

                }

            },
            1000 / 30
        );
}


/* 开始按钮 */

startBtn.addEventListener(
    "click",
    startGame
);

</script>

</body>
</html>
