<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>若兰 ❤️</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft YaHei",
        sans-serif;
}

body{
    background:
        radial-gradient(circle at 20% 20%,#ffb6d9 0%,transparent 30%),
        radial-gradient(circle at 80% 20%,#b8b5ff 0%,transparent 30%),
        linear-gradient(135deg,#160b24,#32134c,#160b24);

    color:white;
    touch-action:none;
}

/* 游戏区域 */

#game{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
}

/* 顶部 */

.title{
    position:absolute;
    top:18px;
    left:50%;
    transform:translateX(-50%);
    z-index:50;

    text-align:center;

    font-size:32px;
    font-weight:800;

    text-shadow:
        0 0 10px #ff66b3,
        0 0 25px #ff1493,
        0 0 40px #ff1493;
}

.subtitle{
    font-size:14px;
    margin-top:4px;
    opacity:.85;
}

/* 分数 */

.score{
    position:absolute;
    top:20px;
    right:20px;
    z-index:50;

    padding:10px 16px;

    border-radius:20px;

    background:rgba(255,255,255,.15);
    backdrop-filter:blur(10px);

    font-weight:bold;
}

/* 游戏场地 */

#arena{
    position:absolute;
    inset:0;
}

/* 人物 */

.character{
    position:absolute;

    width:76px;
    height:76px;

    object-fit:cover;

    border-radius:50%;

    border:3px solid rgba(255,255,255,.9);

    box-shadow:
        0 0 10px rgba(255,255,255,.7),
        0 0 25px rgba(255,80,180,.7);

    user-select:none;
    -webkit-user-drag:none;

    z-index:20;

    transition:
        transform .08s linear;
}

/* 男生 */

#boy{
    left:50%;
    top:65%;

    transform:translate(-50%,-50%);
}

/* 女生 */

#girl{
    left:70%;
    top:35%;

    transform:translate(-50%,-50%);

    box-shadow:
        0 0 10px white,
        0 0 25px #ff8bd1,
        0 0 45px #ff1493;
}

/* 人物名字 */

.name{
    position:absolute;
    z-index:25;

    font-size:15px;
    font-weight:bold;

    transform:translateX(-50%);

    text-shadow:0 2px 5px black;

    pointer-events:none;
}

#boyName{
    left:50%;
    top:calc(65% + 45px);
}

#girlName{
    left:70%;
    top:calc(35% + 45px);
}

/* 爱心 */

.heart{
    position:absolute;

    z-index:100;

    pointer-events:none;

    font-size:30px;

    animation:
        heartFly 1.8s ease-out forwards;

    text-shadow:
        0 0 8px #fff,
        0 0 18px #ff1493,
        0 0 35px #ff1493;
}

@keyframes heartFly{

    0%{
        transform:
            translate(-50%,-50%)
            scale(.2)
            rotate(-20deg);

        opacity:0;
    }

    20%{
        opacity:1;
    }

    60%{
        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% - 100px)
            )
            scale(1.5)
            rotate(20deg);

        opacity:1;
    }

    100%{
        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% - 230px)
            )
            scale(.7)
            rotate(-20deg);

        opacity:0;
    }
}

/* 爱你文字 */

.loveMessage{
    position:absolute;

    z-index:120;

    left:50%;
    top:45%;

    transform:translate(-50%,-50%) scale(.3);

    font-size:48px;
    font-weight:900;

    white-space:nowrap;

    color:#fff;

    text-shadow:
        0 0 5px white,
        0 0 15px #ff4da6,
        0 0 30px #ff1493,
        0 0 60px #ff1493;

    animation:
        loveShow 2.2s ease forwards;

    pointer-events:none;
}

@keyframes loveShow{

    0%{
        opacity:0;
        transform:translate(-50%,-50%) scale(.2);
    }

    25%{
        opacity:1;
        transform:translate(-50%,-50%) scale(1.2);
    }

    45%{
        transform:translate(-50%,-50%) scale(1);
    }

    80%{
        opacity:1;
    }

    100%{
        opacity:0;
        transform:translate(-50%,-70%) scale(1.15);
    }
}

/* 大爱心 */

.bigHeart{
    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    z-index:110;

    font-size:130px;

    animation:
        bigHeart 2s ease forwards;

    pointer-events:none;

    filter:
        drop-shadow(0 0 10px white)
        drop-shadow(0 0 25px #ff1493)
        drop-shadow(0 0 50px #ff1493);
}

@keyframes bigHeart{

    0%{
        opacity:0;
        transform:translate(-50%,-50%) scale(.1);
    }

    25%{
        opacity:1;
        transform:translate(-50%,-50%) scale(1.25);
    }

    50%{
        transform:translate(-50%,-50%) scale(.95);
    }

    75%{
        transform:translate(-50%,-50%) scale(1.1);
    }

    100%{
        opacity:0;
        transform:translate(-50%,-50%) scale(1.5);
    }
}

/* 星星 */

.star{
    position:absolute;

    width:5px;
    height:5px;

    border-radius:50%;

    background:white;

    box-shadow:
        0 0 8px white,
        0 0 15px #ff8bd1;

    animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
    from{
        opacity:.2;
        transform:scale(.5);
    }

    to{
        opacity:1;
        transform:scale(1.5);
    }
}

/* 手机摇杆 */

#joystick{
    position:absolute;

    bottom:35px;
    left:35px;

    width:130px;
    height:130px;

    border-radius:50%;

    background:rgba(255,255,255,.12);

    border:
        2px solid
        rgba(255,255,255,.25);

    backdrop-filter:blur(8px);

    z-index:200;

    display:none;
}

#stick{
    position:absolute;

    width:60px;
    height:60px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:rgba(255,255,255,.35);

    border:2px solid rgba(255,255,255,.7);

    box-shadow:
        0 0 15px #ff70bd;

    touch-action:none;
}

/* 手机 */

@media(max-width:700px){

    .title{
        top:12px;
        font-size:26px;
    }

    .subtitle{
        font-size:12px;
    }

    .score{
        top:15px;
        right:12px;
        font-size:13px;
    }

    .character{
        width:64px;
        height:64px;
    }

    #joystick{
        display:block;
    }

    .loveMessage{
        font-size:34px;
    }

    .bigHeart{
        font-size:100px;
    }

}

/* 开始按钮 */

#startScreen{

    position:absolute;

    inset:0;

    z-index:500;

    display:flex;

    align-items:center;

    justify-content:center;

    flex-direction:column;

    background:
        linear-gradient(
            rgba(20,5,35,.72),
            rgba(20,5,35,.82)
        );

    backdrop-filter:blur(8px);

    text-align:center;
}

.startTitle{
    font-size:58px;
    font-weight:900;

    margin-bottom:10px;

    text-shadow:
        0 0 15px #ff1493,
        0 0 40px #ff1493;
}

.startText{
    opacity:.9;
    margin-bottom:25px;
}

#startButton{

    border:0;

    padding:15px 42px;

    border-radius:40px;

    font-size:20px;

    font-weight:bold;

    color:white;

    background:
        linear-gradient(
            135deg,
            #ff4da6,
            #ff1493
        );

    box-shadow:
        0 0 20px #ff1493,
        0 8px 30px rgba(255,20,147,.4);

    cursor:pointer;
}

#startButton:active{
    transform:scale(.94);
}

</style>
</head>

<body>

<div id="game">

    <!-- 开始界面 -->

    <div id="startScreen">

        <div class="startTitle">
            ❤️ 若兰
        </div>

        <div class="startText">
            追到你，只为告诉你一句话
        </div>

        <button id="startButton">
            开始追爱 ❤️
        </button>

    </div>

    <!-- 标题 -->

    <div class="title">
        ❤️ 若兰
        <div class="subtitle">
            只想追到你
        </div>
    </div>

    <div class="score">
        ❤️ 追爱次数：<span id="score">0</span>
    </div>

    <!-- 游戏区域 -->

    <div id="arena">

        <img
            id="boy"
            class="character"
            src="boy.jpg"
            alt="男生"
        >

        <img
            id="girl"
            class="character"
            src="girl.jpg"
            alt="若兰"
        >

        <div id="boyName" class="name">
            我
        </div>

        <div id="girlName" class="name">
            若兰
        </div>

    </div>

    <!-- 手机摇杆 -->

    <div id="joystick">
        <div id="stick"></div>
    </div>

</div>

<script>

/* =========================
   游戏变量
========================= */

const boy = document.getElementById("boy");
const girl = document.getElementById("girl");
const arena = document.getElementById("arena");

const scoreText = document.getElementById("score");

const startScreen = document.getElementById("startScreen");
const startButton = document.getElementById("startButton");

const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");

let running = false;

let score = 0;

let boyX = 0.5;
let boyY = 0.65;

let girlX = 0.7;
let girlY = 0.35;

let targetX = 0;
let targetY = 0;

let girlVX = 0.0015;
let girlVY = 0.0012;

let keys = {};

let joyX = 0;
let joyY = 0;


/* =========================
   创建背景星星
========================= */

for(let i=0;i<35;i++){

    const star = document.createElement("div");

    star.className = "star";

    star.style.left =
        Math.random()*100 + "%";

    star.style.top =
        Math.random()*100 + "%";

    star.style.animationDelay =
        Math.random()*2 + "s";

    arena.appendChild(star);
}


/* =========================
   键盘控制
========================= */

document.addEventListener("keydown",e=>{

    keys[e.key.toLowerCase()] = true;

});

document.addEventListener("keyup",e=>{

    keys[e.key.toLowerCase()] = false;

});


/* =========================
   手机摇杆
========================= */

let joystickActive = false;

function joystickMove(clientX,clientY){

    const rect =
        joystick.getBoundingClientRect();

    const centerX =
        rect.left + rect.width/2;

    const centerY =
        rect.top + rect.height/2;

    let dx =
        clientX-centerX;

    let dy =
        clientY-centerY;

    const max =
        rect.width/2 - 30;

    const distance =
        Math.sqrt(dx*dx+dy*dy);

    if(distance > max){

        dx =
            dx/distance*max;

        dy =
            dy/distance*max;

    }

    joyX =
        dx/max;

    joyY =
        dy/max;

    stick.style.left =
        "calc(50% + " + dx + "px)";

    stick.style.top =
        "calc(50% + " + dy + "px)";
}


stick.addEventListener(
    "touchstart",
    e=>{

        joystickActive = true;

        e.preventDefault();

    },
    {passive:false}
);


document.addEventListener(
    "touchmove",
    e=>{

        if(!joystickActive) return;

        const touch =
            e.touches[0];

        joystickMove(
            touch.clientX,
            touch.clientY
        );

        e.preventDefault();

    },
    {passive:false}
);


document.addEventListener(
    "touchend",
    ()=>{

        joystickActive = false;

        joyX = 0;
        joyY = 0;

        stick.style.left = "50%";
        stick.style.top = "50%";

    }
);


/* =========================
   设置人物位置
========================= */

function updateBoy(){

    const w =
        arena.clientWidth;

    const h =
        arena.clientHeight;

    const size =
        window.innerWidth <= 700 ? 64 : 76;

    const margin =
        size/2;

    const x =
        Math.max(
            margin,
            Math.min(
                w-margin,
                boyX*w
            )
        );

    const y =
        Math.max(
            margin+20,
            Math.min(
                h-margin,
                boyY*h
            )
        );

    boy.style.left =
        x + "px";

    boy.style.top =
        y + "px";

    document.getElementById("boyName").style.left =
        x + "px";

    document.getElementById("boyName").style.top =
        (y+size/2+8) + "px";
}


/* =========================
   女生移动
========================= */

function updateGirl(){

    const w =
        arena.clientWidth;

    const h =
        arena.clientHeight;

    girlX += girlVX;
    girlY += girlVY;

    if(girlX < 0.12 || girlX > 0.88){

        girlVX *= -1;

    }

    if(girlY < 0.18 || girlY > 0.82){

        girlVY *= -1;

    }

    const x =
        girlX*w;

    const y =
        girlY*h;

    girl.style.left =
        x + "px";

    girl.style.top =
        y + "px";

    document.getElementById("girlName").style.left =
        x + "px";

    document.getElementById("girlName").style.top =
        (y+38) + "px";
}


/* =========================
   移动男生
========================= */

function moveBoy(){

    if(!running) return;

    let dx = 0;
    let dy = 0;

    /* 键盘 */

    if(
        keys["arrowleft"] ||
        keys["a"]
    ){
        dx -= 1;
    }

    if(
        keys["arrowright"] ||
        keys["d"]
    ){
        dx += 1;
    }

    if(
        keys["arrowup"] ||
        keys["w"]
    ){
        dy -= 1;
    }

    if(
        keys["arrowdown"] ||
        keys["s"]
    ){
        dy += 1;
    }

    /* 手机摇杆 */

    if(Math.abs(joyX)>0.05){

        dx += joyX;

    }

    if(Math.abs(joyY)>0.05){

        dy += joyY;

    }

    const length =
        Math.sqrt(dx*dx+dy*dy);

    if(length>0){

        dx /= length;
        dy /= length;

        const speed =
            window.innerWidth <= 700
            ? 0.006
            : 0.005;

        boyX += dx*speed;
        boyY += dy*speed;

    }

    boyX =
        Math.max(
            0.06,
            Math.min(.94,boyX)
        );

    boyY =
        Math.max(
            0.12,
            Math.min(.9,boyY)
        );

    updateBoy();

}


/* =========================
   碰撞检测
========================= */

function checkCollision(){

    const dx =
        (boyX-girlX) *
        arena.clientWidth;

    const dy =
        (boyY-girlY) *
        arena.clientHeight;

    const distance =
        Math.sqrt(dx*dx+dy*dy);

    if(distance < 65){

        love();

    }

}


/* =========================
   追到若兰
========================= */

let collisionLock = false;

function love(){

    if(collisionLock) return;

    collisionLock = true;

    score++;

    scoreText.textContent =
        score;

    const x =
        girlX*arena.clientWidth;

    const y =
        girlY*arena.clientHeight;


    /* 大爱心 */

    const big =
        document.createElement("div");

    big.className =
        "bigHeart";

    big.textContent =
        "❤️";

    arena.appendChild(big);


    /* 爱你若兰 */

    const message =
        document.createElement("div");

    message.className =
        "loveMessage";

    message.textContent =
        "爱你，若兰 ❤️";

    arena.appendChild(message);


    /* 小爱心 */

    for(let i=0;i<18;i++){

        setTimeout(()=>{

            const heart =
                document.createElement("div");

            heart.className =
                "heart";

            heart.textContent =
                ["❤️","💗","💕","💖","💘"][Math.floor(Math.random()*5)];

            heart.style.left =
                x + (Math.random()*80-40) + "px";

            heart.style.top =
                y + (Math.random()*50-25) + "px";

            heart.style.setProperty(
                "--x",
                (Math.random()*180-90) + "px"
            );

            arena.appendChild(heart);

            setTimeout(()=>{
                heart.remove();
            },2000);

        },i*60);

    }


    /* 爱心动画结束后继续游戏 */

    setTimeout(()=>{

        big.remove();
        message.remove();

        /* 把女生放到新的位置 */

        girlX =
            0.15 +
            Math.random()*0.7;

        girlY =
            0.2 +
            Math.random()*0.6;

        /* 女生换一个方向 */

        girlVX =
            (Math.random()>0.5?1:-1)
            *(0.001+
            Math.random()*0.002);

        girlVY =
            (Math.random()>0.5?1:-1)
            *(0.001+
            Math.random()*0.002);

        collisionLock = false;

    },2100);

}


/* =========================
   游戏循环
========================= */

function gameLoop(){

    moveBoy();

    if(running){

        updateGirl();

        checkCollision();

    }

    requestAnimationFrame(gameLoop);

}


/* =========================
   开始游戏
========================= */

startButton.addEventListener(
    "click",
    ()=>{

        running = true;

        score = 0;

        scoreText.textContent =
            "0";

        boyX = .5;
        boyY = .65;

        girlX = .7;
        girlY = .35;

        updateBoy();
        updateGirl();

        startScreen.style.display =
            "none";

    }
);


/* =========================
   初始化
========================= */

updateBoy();
updateGirl();

gameLoop();

</script>

</body>
</html>
