<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>爱你若兰 ❤️</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:
        "Microsoft YaHei",
        "PingFang SC",
        sans-serif;
}

body{
    background:
        radial-gradient(circle at 50% 20%,#ffb6d9,#8d5cff 45%,#19152f);
    color:white;
}

/* ===============================
   游戏主界面
================================ */

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
}

/* 星空 */

.star{
    position:absolute;
    width:3px;
    height:3px;
    background:white;
    border-radius:50%;
    opacity:.7;
    animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
    from{opacity:.2;transform:scale(.7)}
    to{opacity:1;transform:scale(1.4)}
}

/* 顶部 */

#top{
    position:absolute;
    z-index:20;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    text-align:center;
    width:100%;
    pointer-events:none;
}

#title{
    font-size:clamp(28px,7vw,48px);
    font-weight:900;
    text-shadow:
        0 0 8px #fff,
        0 0 20px #ff65b5,
        0 0 40px #ff2c91;
}

#info{
    margin-top:6px;
    font-size:18px;
}

#time{
    display:inline-block;
    margin-top:8px;
    padding:7px 18px;
    border-radius:30px;
    background:#0005;
    backdrop-filter:blur(10px);
    font-weight:bold;
}

/* 游戏区域 */

#arena{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

/* 人物 */

.character{
    position:absolute;
    width:75px;
    height:75px;
    object-fit:cover;
    border-radius:50%;
    border:4px solid white;
    box-shadow:
        0 0 10px #fff,
        0 0 25px #ff5caf;
    user-select:none;
    pointer-events:none;
}

#boy{
    z-index:10;
}

#girl{
    z-index:9;
}

/* 人物名字 */

.name{
    position:absolute;
    z-index:12;
    transform:translateX(-50%);
    font-size:14px;
    font-weight:bold;
    text-shadow:0 2px 5px #000;
    pointer-events:none;
}

/* ===============================
   爱心
================================ */

.heart{
    position:absolute;
    z-index:30;
    pointer-events:none;
    font-size:42px;
    transform:translate(-50%,-50%);
    animation:heartBoom 1.8s ease-out forwards;
}

@keyframes heartBoom{
    0%{
        transform:translate(-50%,-50%) scale(.2) rotate(-15deg);
        opacity:0;
    }

    20%{
        transform:translate(-50%,-70%) scale(1.5) rotate(10deg);
        opacity:1;
    }

    55%{
        transform:translate(-50%,-130%) scale(1.1);
        opacity:1;
    }

    100%{
        transform:translate(-50%,-260%) scale(.5);
        opacity:0;
    }
}

/* 爱你若兰 */

.loveText{
    position:absolute;
    z-index:35;
    left:50%;
    top:42%;
    transform:translate(-50%,-50%) scale(.2);
    font-size:clamp(38px,10vw,80px);
    font-weight:900;
    white-space:nowrap;
    color:#fff;
    text-shadow:
        0 0 8px #fff,
        0 0 20px #ff4fa3,
        0 0 40px #ff1493,
        0 0 70px #ff1493;
    animation:loveShow 2.4s ease-out forwards;
    pointer-events:none;
}

@keyframes loveShow{
    0%{
        opacity:0;
        transform:translate(-50%,-50%) scale(.2) rotate(-8deg);
    }

    25%{
        opacity:1;
        transform:translate(-50%,-50%) scale(1.15) rotate(3deg);
    }

    50%{
        transform:translate(-50%,-50%) scale(1);
    }

    100%{
        opacity:0;
        transform:translate(-50%,-100%) scale(1.25);
    }
}

/* 粒子 */

.particle{
    position:absolute;
    z-index:32;
    pointer-events:none;
    font-size:20px;
    animation:particle 1.4s ease-out forwards;
}

@keyframes particle{
    0%{
        opacity:1;
        transform:translate(0,0) scale(1);
    }

    100%{
        opacity:0;
        transform:
            translate(
                calc((var(--x))*1px),
                calc((var(--y))*1px)
            )
            scale(.2);
    }
}

/* ===============================
   虚拟摇杆
================================ */

#joystick{
    position:absolute;
    z-index:50;
    left:25px;
    bottom:25px;
    width:130px;
    height:130px;
    border-radius:50%;
    background:#ffffff22;
    border:2px solid #ffffff55;
    backdrop-filter:blur(8px);
    touch-action:none;
}

#stick{
    position:absolute;
    width:58px;
    height:58px;
    left:36px;
    top:36px;
    border-radius:50%;
    background:#ffffffaa;
    box-shadow:
        0 0 15px #ff8bc8,
        inset 0 0 10px #fff;
    touch-action:none;
}

/* 开始按钮 */

#startBtn{
    position:absolute;
    z-index:60;
    left:50%;
    bottom:30px;
    transform:translateX(-50%);
    border:0;
    padding:13px 30px;
    border-radius:30px;
    font-size:18px;
    font-weight:bold;
    color:white;
    background:linear-gradient(135deg,#ff4da6,#8d5cff);
    box-shadow:0 0 20px #ff4da6;
    cursor:pointer;
}

/* 游戏结束 */

#gameOver{
    display:none;
    position:absolute;
    z-index:100;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:min(90vw,450px);
    padding:35px 25px;
    text-align:center;
    border-radius:25px;
    background:#160f2eee;
    backdrop-filter:blur(15px);
    box-shadow:0 0 50px #ff4da6;
}

#gameOver h2{
    font-size:38px;
    margin:0 0 15px;
}

#gameOver p{
    font-size:22px;
}

#restart{
    margin-top:15px;
    border:0;
    padding:13px 30px;
    border-radius:30px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    color:white;
    background:linear-gradient(135deg,#ff4da6,#8d5cff);
}

/* PC隐藏摇杆 */

@media (min-width:800px){
    #joystick{
        opacity:.35;
    }
}
</style>
</head>


<body>

<div id="game">

    <!-- 星空 -->
    <div id="stars"></div>

    <!-- 顶部 -->
    <div id="top">
        <div id="title">❤️ 爱你若兰 ❤️</div>
        <div id="info">追到若兰，就告诉她：我爱你</div>
        <div id="time">准备开始</div>
    </div>

    <!-- 游戏区 -->
    <div id="arena">

        <img id="boy"
             class="character"
             src="boy.jpg"
             alt="男生">

        <img id="girl"
             class="character"
             src="girl.jpg"
             alt="若兰">

        <div id="boyName" class="name">帅哥</div>
        <div id="girlName" class="name">若兰 ❤️</div>

    </div>

    <!-- 手机摇杆 -->
    <div id="joystick">
        <div id="stick"></div>
    </div>

    <!-- 开始 -->
    <button id="startBtn">开始追若兰 ❤️</button>

    <!-- 游戏结束 -->
    <div id="gameOver">
        <h2>❤️ 爱你若兰 ❤️</h2>
        <p id="result"></p>
        <button id="restart">再来一次</button>
    </div>

</div>


<script>

/* =====================================================
   基础变量
===================================================== */

const game = document.getElementById("game");
const arena = document.getElementById("arena");

const boy = document.getElementById("boy");
const girl = document.getElementById("girl");

const boyName = document.getElementById("boyName");
const girlName = document.getElementById("girlName");

const timeText = document.getElementById("time");

const startBtn = document.getElementById("startBtn");

const gameOver = document.getElementById("gameOver");
const result = document.getElementById("result");
const restart = document.getElementById("restart");

const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");


/* =====================================================
   星空
===================================================== */

for(let i=0;i<80;i++){

    const star=document.createElement("div");

    star.className="star";

    star.style.left=Math.random()*100+"%";
    star.style.top=Math.random()*100+"%";

    star.style.animationDelay=
        Math.random()*2+"s";

    game.appendChild(star);
}


/* =====================================================
   游戏状态
===================================================== */

let running=false;

let timeLeft=60;

let timer=null;

let lastTime=performance.now();

let loveCount=0;


/* =====================================================
   人物位置
===================================================== */

let boyX=100;
let boyY=300;

let girlX=500;
let girlY=300;


/* =====================================================
   移动速度
===================================================== */

const boySpeed=260;

let keyLeft=false;
let keyRight=false;
let keyUp=false;
let keyDown=false;


/* =====================================================
   女生AI
===================================================== */

let girlVX=100;
let girlVY=60;


/* =====================================================
   初始化人物
===================================================== */

function resetCharacters(){

    const w=arena.clientWidth;
    const h=arena.clientHeight;

    boyX=Math.max(30,w*.15);
    boyY=h*.55;

    girlX=Math.min(w-100,w*.7);
    girlY=h*.45;

    girlVX=(Math.random()>.5?1:-1)*100;
    girlVY=(Math.random()>.5?1:-1)*70;

    drawCharacters();
}


/* =====================================================
   显示人物
===================================================== */

function drawCharacters(){

    boy.style.left=boyX+"px";
    boy.style.top=boyY+"px";

    girl.style.left=girlX+"px";
    girl.style.top=girlY+"px";

    boyName.style.left=(boyX+37)+"px";
    boyName.style.top=(boyY-25)+"px";

    girlName.style.left=(girlX+37)+"px";
    girlName.style.top=(girlY-25)+"px";
}


/* =====================================================
   键盘控制
===================================================== */

document.addEventListener("keydown",function(e){

    if(e.key==="ArrowLeft" || e.key.toLowerCase()==="a"){
        keyLeft=true;
    }

    if(e.key==="ArrowRight" || e.key.toLowerCase()==="d"){
        keyRight=true;
    }

    if(e.key==="ArrowUp" || e.key.toLowerCase()==="w"){
        keyUp=true;
    }

    if(e.key==="ArrowDown" || e.key.toLowerCase()==="s"){
        keyDown=true;
    }

});


document.addEventListener("keyup",function(e){

    if(e.key==="ArrowLeft" || e.key.toLowerCase()==="a"){
        keyLeft=false;
    }

    if(e.key==="ArrowRight" || e.key.toLowerCase()==="d"){
        keyRight=false;
    }

    if(e.key==="ArrowUp" || e.key.toLowerCase()==="w"){
        keyUp=false;
    }

    if(e.key==="ArrowDown" || e.key.toLowerCase()==="s"){
        keyDown=false;
    }

});


/* =====================================================
   手机摇杆
===================================================== */

let joyX=0;
let joyY=0;
let joyActive=false;

function updateJoystick(clientX,clientY){

    const rect=joystick.getBoundingClientRect();

    const centerX=rect.left+rect.width/2;
    const centerY=rect.top+rect.height/2;

    let dx=clientX-centerX;
    let dy=clientY-centerY;

    const max=45;

    const distance=Math.sqrt(dx*dx+dy*dy);

    if(distance>max){

        dx=dx/distance*max;
        dy=dy/distance*max;

    }

    stick.style.left=(36+dx)+"px";
    stick.style.top=(36+dy)+"px";

    joyX=dx/max;
    joyY=dy/max;
}


joystick.addEventListener("pointerdown",function(e){

    joyActive=true;

    joystick.setPointerCapture(e.pointerId);

    updateJoystick(e.clientX,e.clientY);

});


joystick.addEventListener("pointermove",function(e){

    if(!joyActive)return;

    updateJoystick(e.clientX,e.clientY);

});


joystick.addEventListener("pointerup",function(){

    joyActive=false;

    joyX=0;
    joyY=0;

    stick.style.left="36px";
    stick.style.top="36px";

});


joystick.addEventListener("pointercancel",function(){

    joyActive=false;

    joyX=0;
    joyY=0;

    stick.style.left="36px";
    stick.style.top="36px";

});


/* =====================================================
   开始游戏
===================================================== */

function startGame(){

    running=true;

    timeLeft=60;

    loveCount=0;

    gameOver.style.display="none";

    startBtn.style.display="none";

    resetCharacters();

    timeText.innerText="剩余 60 秒";

    lastTime=performance.now();

    clearInterval(timer);

    timer=setInterval(function(){

        if(!running)return;

        timeLeft--;

        timeText.innerText=
            "剩余 "+timeLeft+" 秒";

        if(timeLeft<=0){

            endGame();

        }

    },1000);

}


startBtn.addEventListener("click",startGame);

restart.addEventListener("click",startGame);


/* =====================================================
   游戏结束
===================================================== */

function endGame(){

    running=false;

    clearInterval(timer);

    gameOver.style.display="block";

    result.innerHTML=
        "成功追到若兰 <b>"+loveCount+"</b> 次 ❤️<br><br>"+
        "若兰，我爱你！💕";

}


/* =====================================================
   碰撞检测
===================================================== */

function checkCollision(){

    const dx=boyX-girlX;
    const dy=boyY-girlY;

    const distance=Math.sqrt(dx*dx+dy*dy);

    if(distance<60){

        loveCount++;

        createLove();

        /* 女生被追到以后重新跑 */
        moveGirlAway();

    }

}


/* =====================================================
   女生逃跑
===================================================== */

function moveGirlAway(){

    const w=arena.clientWidth;
    const h=arena.clientHeight;

    girlX=
        40+
        Math.random()*
        Math.max(50,w-120);

    girlY=
        100+
        Math.random()*
        Math.max(50,h-180);

    girlVX=
        (Math.random()>.5?1:-1)*
        (80+Math.random()*120);

    girlVY=
        (Math.random()>.5?1:-1)*
        (50+Math.random()*100);

}


/* =====================================================
   炫酷爱心
===================================================== */

function createLove(){

    const x=(boyX+girlX)/2+37;

    const y=(boyY+girlY)/2+37;


    /* 大爱心 */

    const heart=document.createElement("div");

    heart.className="heart";

    heart.innerHTML="❤️";

    heart.style.left=x+"px";

    heart.style.top=y+"px";

    arena.appendChild(heart);


    setTimeout(function(){

        heart.remove();

    },2000);


    /* 爱你若兰 */

    const text=document.createElement("div");

    text.className="loveText";

    text.innerHTML="💗 爱你若兰 💗";

    arena.appendChild(text);


    setTimeout(function(){

        text.remove();

    },2500);


    /* 粒子 */

    for(let i=0;i<25;i++){

        const p=document.createElement("div");

        p.className="particle";

        p.innerHTML=
            ["❤️","💕","💖","💗","✨"][Math.floor(Math.random()*5)];

        p.style.left=x+"px";

        p.style.top=y+"px";

        p.style.setProperty(
            "--x",
            (Math.random()*240-120)
        );

        p.style.setProperty(
            "--y",
            (Math.random()*240-180)
        );

        arena.appendChild(p);


        setTimeout(function(){

            p.remove();

        },1500);

    }

}


/* =====================================================
   主游戏循环
===================================================== */

function gameLoop(now){

    const dt=Math.min(
        (now-lastTime)/1000,
        .05
    );

    lastTime=now;


    if(running){

        /* -------------------------
           男生移动
        ------------------------- */

        let dx=0;
        let dy=0;


        if(keyLeft)dx-=1;
        if(keyRight)dx+=1;
        if(keyUp)dy-=1;
        if(keyDown)dy+=1;


        /* 手机摇杆 */

        dx+=joyX;
        dy+=joyY;


        const len=Math.sqrt(dx*dx+dy*dy);

        if(len>1){

            dx/=len;
            dy/=len;

        }


        boyX+=dx*boySpeed*dt;
        boyY+=dy*boySpeed*dt;


        /* 边界 */

        const w=arena.clientWidth;
        const h=arena.clientHeight;

        boyX=Math.max(
            0,
            Math.min(w-75,boyX)
        );

        boyY=Math.max(
            70,
            Math.min(h-75,boyY)
        );


        /* -------------------------
           女生自动移动
        ------------------------- */

        girlX+=girlVX*dt;
        girlY+=girlVY*dt;


        if(girlX<=0){

            girlX=0;
            girlVX=Math.abs(girlVX);

        }

        if(girlX>=w-75){

            girlX=w-75;
            girlVX=-Math.abs(girlVX);

        }

        if(girlY<=70){

            girlY=70;
            girlVY=Math.abs(girlVY);

        }

        if(girlY>=h-75){

            girlY=h-75;
            girlVY=-Math.abs(girlVY);

        }


        /* -------------------------
           碰撞
        ------------------------- */

        checkCollision();


        drawCharacters();

    }


    requestAnimationFrame(gameLoop);

}


/* =====================================================
   启动
===================================================== */

resetCharacters();

requestAnimationFrame(gameLoop);


/* =====================================================
   手机屏幕方向变化
===================================================== */

window.addEventListener("resize",function(){

    if(!running){

        resetCharacters();

    }

});

</script>

</body>
</html>
